name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build WASM via Docker
        uses: docker/build-push-action@v6
        with:
          context: ./wasm
          load: true
          tags: openslide-wasm-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract WASM artifacts
        run: |
          docker create --name wasm-extract openslide-wasm-builder:latest
          mkdir -p wasm/dist
          docker cp wasm-extract:/build/out/openslide.js wasm/dist/
          docker cp wasm-extract:/build/out/openslide.wasm wasm/dist/
          docker rm wasm-extract

      - name: Verify committed licenses/ matches generated output
        run: |
          set -e
          docker create --name license-drift openslide-wasm-builder:latest
          rm -rf /tmp/generated-licenses
          docker cp license-drift:/build/out/licenses /tmp/generated-licenses
          docker rm license-drift
          # licenses/README.md is hand-written and not generated; exclude it.
          if ! diff -r --exclude=README.md licenses /tmp/generated-licenses; then
            echo "::error::Committed licenses/ does not match the tree generated by collect-licenses.sh."
            echo "::error::Regenerate it: see licenses/README.md for the procedure."
            exit 1
          fi
          echo "licenses/ is in sync with the build."

      - name: Build TypeScript
        run: npm run build:ts

      - name: Unit tests
        run: npm test

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify license artifacts are packaged
        run: |
          set -e
          npm pack --dry-run --json > /tmp/pack.json
          for required in \
            "LICENSE" \
            "NOTICE" \
            "licenses/openslide/" \
            "wasm/dependencies/fetch-openslide.sh" \
            "wasm/patches/openslide.patch"
          do
            if ! grep -q "$required" /tmp/pack.json; then
              echo "::error::Required file missing from npm tarball: $required"
              exit 1
            fi
          done
          echo "License artifact check passed."

      - name: Verify NOTICE covers every fetched dependency
        run: |
          set -e
          # Coarse substring match: fetch-<dep>.sh basenames are checked
          # case-insensitively against NOTICE. Some upstream project names
          # differ from their fetch-script name (e.g. the script is named
          # fetch-libexpat.sh but the project is commonly called "Expat");
          # NOTICE mentions both forms ("Expat (libexpat)"), so the
          # substring match still succeeds without extra mapping.
          missing=0
          for f in wasm/dependencies/fetch-*.sh; do
            dep=$(basename "$f" .sh); dep=${dep#fetch-}
            if ! grep -qi "$dep" NOTICE; then
              echo "::error::Dependency '$dep' is fetched but not mentioned in NOTICE"
              missing=1
            fi
          done
          exit $missing
