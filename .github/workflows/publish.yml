name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (for trusted publishing OIDC)
        run: npm install -g npm@latest

      - name: Print versions
        run: |
          node --version
          npm --version

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build WASM via Docker
        uses: docker/build-push-action@v6
        with:
          context: ./wasm
          load: true
          tags: openslide-wasm-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract WASM artifacts
        run: |
          docker create --name wasm-extract openslide-wasm-builder:latest
          mkdir -p wasm/dist
          docker cp wasm-extract:/build/out/openslide.js wasm/dist/
          docker cp wasm-extract:/build/out/openslide.wasm wasm/dist/
          docker rm wasm-extract

      - name: Build TypeScript
        run: npm run build:ts

      - name: Unit tests
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance

      - name: Assemble release bundle
        run: |
          set -e
          mkdir -p release-bundle
          cp wasm/dist/openslide.js wasm/dist/openslide.wasm release-bundle/
          cp LICENSE NOTICE release-bundle/
          # Bundle the per-component license texts as one archive: attaching
          # them individually would flatten the directory structure and
          # collide on basename (multiple components ship a file named
          # COPYING, e.g. cairo, glib, gdk-pixbuf, fontconfig, pixman).
          tar czf release-bundle/licenses.tar.gz licenses
          # Complete corresponding source for the binaries above (LGPL-2.1 §6)
          git archive --format=tar.gz --prefix=openslide-js-src/ HEAD \
            -o release-bundle/openslide-js-source.tar.gz
          (cd release-bundle && find . -type f ! -name SHA256SUMS -exec sha256sum {} + > SHA256SUMS)
          ls -la release-bundle

      - name: Attach release bundle
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-bundle/openslide.js
            release-bundle/openslide.wasm
            release-bundle/openslide-js-source.tar.gz
            release-bundle/licenses.tar.gz
            release-bundle/LICENSE
            release-bundle/NOTICE
            release-bundle/SHA256SUMS
